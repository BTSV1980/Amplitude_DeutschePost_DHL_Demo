<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFCC00">
  <title>Post &amp; Parcel – demo app</title>

  <!-- Amplitude Web Experimentation: must load first in <head> to avoid flicker -->
  <script src="https://cdn.amplitude.com/script/02d8b022bb08fad84e136356e6adf00a.experiment.js"></script>

  <!-- Amplitude Analytics + Session Replay -->
  <script src="https://cdn.amplitude.com/script/02d8b022bb08fad84e136356e6adf00a.js"></script>
  <!-- Amplitude Guides & Surveys -->
  <script src="https://cdn.amplitude.com/script/02d8b022bb08fad84e136356e6adf00a.engagement.js"></script>
  <script>
    (function () {
      var KEY = '02d8b022bb08fad84e136356e6adf00a';
      if (!window.amplitude) { console.warn('Amplitude SDK not loaded'); return; }
      if (window.sessionReplay) window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 }));
      if (window.engagement) window.amplitude.add(window.engagement.plugin());
      window.amplitude.init(KEY, {
        fetchRemoteConfig: true,
        autocapture: { attribution: true, pageViews: true, sessions: true, formInteractions: true, elementInteractions: true }
      });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="device">
    <p class="demo-note" role="note">Demo app built for an Amplitude product demo. Not affiliated with Deutsche Post DHL.</p>
    <header class="appbar">
      <span class="wordmark">Post &amp; Parcel</span>
      <button class="appbar-btn" id="appbar-account" aria-label="Account" data-route="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Main">
      <button data-route="track" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg><span>Track</span></button>
      <button data-route="ship" class="tab" id="tab-ship"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M7 9h6M7 13h4M16 9h2v3h-2z"/></svg><span>Ship</span></button>
      <button data-route="locations" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0114 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Locations</span></button>
      <button data-route="packstation" class="tab" id="tab-packstation"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M10 3v18"/></svg><span>Packstation</span></button>
      <button data-route="more" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
    </nav>
    <div id="sheet-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
